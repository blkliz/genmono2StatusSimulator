    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理論値一覧表 v0.1.9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theory-values-page">
    <header class="project-header">
        <a href="./index.html" class="header-link">Index</a>
        <div style="font-weight: bold;">理論値一覧表 v0.1.9</div>
    </header>

    <div class="container">
        <div class="mode-selector">
            <button id="btn-s" onclick="changeTarget('s')">S極</button>
            <button id="btn-a" onclick="changeTarget('a')">A極</button>
            <button id="btn-d" onclick="changeTarget('d')">D極</button>
            <button id="btn-l" onclick="changeTarget('l')">L極</button>
        </div>

        <div class="filter-controls">
            <input type="text" id="search-name" placeholder="幻獣名で検索..." oninput="render()">
            <select id="filter-class" onchange="render()">
                <option value="">全クラス</option>
                <option value="SS">SS</option>
                <option value="S">S</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="F">F</option>
            </select>
                    <select id="filter-type" onchange="render()">
                        <option value="">全属性</option>
                    </select>
        </div>
        <div class="table-container">
        <table class="theory-table">
            <thead>
                <tr>
                    <th rowspan="2" onclick="setSort('id')">No</th>
                    <th rowspan="2" onclick="setSort('name')">幻獣名</th>
                    <th rowspan="2" onclick="setSort('class')">クラス</th>
                    <th rowspan="2" onclick="setSort('type')">属性</th> <th colspan="3">S</th>
                    <th colspan="3">A</th>
                    <th colspan="3">D</th>
                    <th colspan="3">L</th>
                    <th rowspan="2">詳細</th>
                </tr>
                <tr>
                    <th onclick="setSort('s')">実数値</th><th onclick="setSort('s_this')">変化pt</th><th onclick="setSort('s_total')">総Pt</th>
                    <th onclick="setSort('a')">実数値</th><th onclick="setSort('a_this')">変化pt</th><th onclick="setSort('a_total')">総Pt</th>
                    <th onclick="setSort('d')">実数値</th><th onclick="setSort('d_this')">変化pt</th><th onclick="setSort('d_total')">総Pt</th>
                    <th onclick="setSort('l')">実数値</th><th onclick="setSort('l_this')">変化pt</th><th onclick="setSort('l_total')">総Pt</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    </div>

    <div id="route-modal" onclick="closeModal()">
        <div class="modal-body" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3 id="modal-title" style="margin-top:0;"></h3>
            <div id="modal-content"></div> 
            <button onclick="closeModal()" style="margin-top: 20px;">閉じる</button>
        </div>
    </div>

    <script src="genjyu_data.js?v=20260512"></script>
    <script src="theory_calc.js?v=20260412"></script>
</body>
</html>
